# Hyperparameter search definition for `python ai/training/hparam_search.py --search_space <this file>`
#
# Set `limited_compute: true` to sweep only `learning_rate` × `freeze_encoder` (other grid
# axes ignored; values come from `base_config`). Example: default LRs below → 3×2 = 6 runs.
# For exactly 4 runs: `limited_compute: true` and `learning_rate: [1.0e-5, 1.0e-4]`.

base_config: ai/training/configs/baseline_frozen.yaml

# Epochs per trial during search (keep small).
budget_epochs: 4

# Epoch count written to `best_config.yaml` for the winning hyperparameters (null = use
# `training.num_epochs` from base_config).
full_training_epochs: null

output:
  results_csv: ai/training/hparam_results.csv
  best_config: ai/training/configs/best_config.yaml
  best_experiment_name: hparam_best

sampling:
  method: grid
  # Used only when method is `random`: sample this many combinations from the search space.
  n_trials: 12
  random_seed: 42

# If true, only `learning_rate` and `freeze_encoder` are varied (minimum practical sweep).
limited_compute: false

grid:
  learning_rate: [1.0e-5, 3.0e-5, 1.0e-4]
  batch_size: [8, 16]
  dropout_rate: [0.1, 0.3]
  freeze_encoder: [true, false]
