services:
  postgres:
    image: postgres:15-alpine
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - app-network

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - .env
    ports:
      - "8000:8000"
    # The DB is OPTIONAL (predictions work without it), so the backend must not
    # block on Postgres health. Wait only for the container to start, so a slow
    # or absent DB never gates inference startup.
    depends_on:
      postgres:
        condition: service_started
    volumes:
      # Persist HITL therapist corrections across restarts.
      - feedback_data:/app/feedback_data
    healthcheck:
      # Healthy only once the model is actually loaded (not just HTTP 200) — a
      # 200 /health can still report model_loaded:false during startup.
      test: ["CMD-SHELL", "python -c \"import json,sys,urllib.request; r=urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5); p=json.load(r); sys.exit(0 if r.status==200 and p.get('model_loaded') is True else 1)\""]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 90s
    restart: unless-stopped
    networks:
      app-network:
        # The mobile API reaches the AI at http://ai-service:8000 (see its
        # AI_PREDICT_URL default). Expose that hostname as a network alias so
        # both stacks connect when joined on a shared network.
        aliases:
          - ai-service

  pgadmin:
    image: dpage/pgadmin4
    env_file:
      - .env
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    ports:
      - "127.0.0.1:5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    restart: unless-stopped
    networks:
      - app-network

volumes:
  postgres_data:
  pgadmin_data:
  feedback_data:

networks:
  app-network: