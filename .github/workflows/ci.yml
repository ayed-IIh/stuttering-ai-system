name: CI

on:
  push:
    branches:
      - "feature/*"
      - "feat/*"
      - "fix/*"

  pull_request:
    branches:
      - dev
      - main
    types:
      - opened
      - synchronize
      - reopened

jobs:
  ci:
    name: Lint and Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run flake8
        run: flake8 ai/ backend/ --config=.flake8

      - name: Run pytest (fast unit tests)
        # NOTE: do NOT mask failures with `|| echo ...` — that turns a red build
        # green. Exit code 5 (no tests collected) is treated as success; any
        # real failure/error fails the job. The heavy model-instantiation tests
        # under tests/ (HF downloads) are run separately, not on every PR.
        run: |
          pytest ai/ backend/ -v --disable-warnings
          code=$?
          if [ "$code" -eq 5 ]; then echo "No tests collected — ok."; exit 0; fi
          exit $code