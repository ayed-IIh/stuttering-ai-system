version: "3.9"

services:
  postgres:
    image: postgres:15-alpine

    env_file:
      - .env

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

    restart: unless-stopped

    networks:
      - app-network

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile

    env_file:
      - .env

    ports:
      - "8000:8000"

    volumes:
      - .:/app

    depends_on:
      postgres:
        condition: service_healthy

    command: >
      uvicorn backend.app.main:app
      --host 0.0.0.0
      --port 8000
      --reload

    restart: unless-stopped

    networks:
      - app-network

  pgadmin:
    image: dpage/pgadmin4

    env_file:
      - .env

    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}

    ports:
      - "127.0.0.1:5050:80"

    depends_on:
      postgres:
        condition: service_healthy

    volumes:
      - pgadmin_data:/var/lib/pgadmin

    restart: unless-stopped

    networks:
      - app-network

volumes:
  postgres_data:
  pgadmin_data:

networks:
  app-network: